name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build FutureNews.sln -c Release -v minimal --nologo

      - name: Publish (framework-dependent win-x64)
        run: dotnet publish src/FutureNews.App/FutureNews.App.csproj -c Release -r win-x64 --self-contained false -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FutureNews-win-x64
          path: out
          if-no-files-found: error
